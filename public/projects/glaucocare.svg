<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="50%" stop-color="#0d1821"/>
      <stop offset="100%" stop-color="#06090c"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14212e"/>
      <stop offset="100%" stop-color="#0c141c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="675"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
  </g>

  <!-- Header Bar -->
  <rect x="60" y="35" width="1080" height="64" rx="8" fill="#111c26" stroke="#06b6d4" stroke-opacity="0.25"/>
  <circle cx="95" cy="67" r="14" fill="#06b6d4" fill-opacity="0.2"/>
  <path d="M89 67 Q95 58 101 67 Q95 76 89 67 Z" fill="none" stroke="#22d3ee" stroke-width="2.2"/>
  <circle cx="95" cy="67" r="3" fill="#22d3ee"/>
  <text x="122" y="73" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">GlaucoCare</text>
  <text x="245" y="72" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">PATIENT HEALTH TELEMETRY</text>
  
  <rect x="940" y="49" width="170" height="34" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <circle cx="960" cy="66" r="4" fill="#10b981"/>
  <text x="975" y="71" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">IOP Normal (15 mmHg)</text>

  <!-- Main Grid: Left Column Cards -->
  <!-- Card 1: IOP Chart -->
  <g transform="translate(60, 120)">
    <rect width="680" height="340" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Intraocular Pressure (IOP) Tracking</text>
    <text x="24" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Weekly circadian monitoring — Target safe zone &lt; 21 mmHg</text>
    
    <!-- Legend -->
    <rect x="520" y="26" width="10" height="10" rx="2" fill="#06b6d4"/>
    <text x="536" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">OD (Right Eye)</text>
    <rect x="520" y="44" width="10" height="10" rx="2" fill="#10b981"/>
    <text x="536" y="53" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">OS (Left Eye)</text>

    <!-- Safe zone band -->
    <rect x="50" y="150" width="590" height="100" fill="#10b981" fill-opacity="0.06"/>
    <line x1="50" y1="150" x2="640" y2="150" stroke="#10b981" stroke-opacity="0.3" stroke-dasharray="4,4"/>
    <text x="600" y="145" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">21 mmHg Threshold</text>

    <!-- Chart grid lines -->
    <line x1="50" y1="280" x2="640" y2="280" stroke="#ffffff" stroke-opacity="0.1"/>
    <line x1="50" y1="215" x2="640" y2="215" stroke="#ffffff" stroke-opacity="0.05"/>
    <line x1="50" y1="150" x2="640" y2="150" stroke="#ffffff" stroke-opacity="0.05"/>
    <line x1="50" y1="85" x2="640" y2="85" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Y-axis labels -->
    <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">30</text>
    <text x="25" y="153" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">20</text>
    <text x="25" y="218" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">10</text>
    <text x="30" y="283" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">0</text>

    <!-- Chart Fill & Lines -->
    <path d="M 60 210 Q 150 170 240 190 T 420 165 T 540 180 T 630 160 L 630 280 L 60 280 Z" fill="url(#chartGrad)"/>
    <path d="M 60 210 Q 150 170 240 190 T 420 165 T 540 180 T 630 160" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
    
    <path d="M 60 230 Q 150 200 240 215 T 420 195 T 540 205 T 630 190" fill="none" stroke="#34d399" stroke-width="2.5"/>

    <!-- Data points -->
    <circle cx="240" cy="190" r="4" fill="#22d3ee" stroke="#082f49" stroke-width="2"/>
    <circle cx="420" cy="165" r="4" fill="#22d3ee" stroke="#082f49" stroke-width="2"/>
    <circle cx="630" cy="160" r="4" fill="#22d3ee" stroke="#082f49" stroke-width="2"/>

    <!-- X-axis labels -->
    <text x="60" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Mon</text>
    <text x="150" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Tue</text>
    <text x="240" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Wed</text>
    <text x="330" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Thu</text>
    <text x="420" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Fri</text>
    <text x="520" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Sat</text>
    <text x="615" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Sun</text>
  </g>

  <!-- Right Column: Medication & Diagnostics -->
  <g transform="translate(760, 120)">
    <!-- Card 2: Medication Schedule -->
    <rect width="380" height="210" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Medication Routine</text>
    
    <!-- Item 1 -->
    <g transform="translate(24, 55)">
      <rect width="332" height="42" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.3"/>
      <circle cx="20" cy="21" r="9" fill="#10b981" fill-opacity="0.2"/>
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#10b981" stroke-width="1.8"/>
      <text x="38" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Latanoprost 0.005%</text>
      <text x="38" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">1 drop both eyes • 09:00 PM</text>
      <text x="270" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TAKEN</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 105)">
      <rect width="332" height="42" rx="6" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="20" cy="21" r="9" fill="#06b6d4" fill-opacity="0.2"/>
      <circle cx="20" cy="21" r="3" fill="#22d3ee"/>
      <text x="38" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Timolol Maleate 0.5%</text>
      <text x="38" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">1 drop both eyes • 08:00 AM</text>
      <text x="260" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">UPCOMING</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 155)">
      <rect width="332" height="42" rx="6" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="20" cy="21" r="9" fill="#f59e0b" fill-opacity="0.2"/>
      <circle cx="20" cy="21" r="3" fill="#f59e0b"/>
      <text x="38" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Brimonidine Tartrate</text>
      <text x="38" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">1 drop both eyes • 02:00 PM</text>
      <text x="268" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REMINDER</text>
    </g>

    <!-- Card 3: Clinical Notes -->
    <g transform="translate(0, 225)">
      <rect width="380" height="195" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Doctor's Clinical Notes</text>
      
      <rect x="24" y="50" width="332" height="120" rx="6" fill="#081017" stroke="#06b6d4" stroke-opacity="0.15"/>
      <text x="40" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Dr. Hendra Kusuma, Sp.M (K)</text>
      <text x="40" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" width="290">"Tekanan intraokular stabil pada rentang</text>
      <text x="40" y="114" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">14-16 mmHg. Teruskan kepatuhan tetes</text>
      <text x="40" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">mata harian. Kontrol lapang pandang bulan depan."</text>
      <text x="40" y="156" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">VERIFIED CLINIC TELEMEDICINE</text>
    </g>
  </g>

  <!-- Bottom Strip: 3 Metrics -->
  <g transform="translate(60, 480)">
    <rect width="215" height="135" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">RIGHT EYE (OD)</text>
    <text x="20" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">14.2</text>
    <text x="105" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16">mmHg</text>
    <text x="20" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">▼ -1.5 vs last week (Good)</text>

    <g transform="translate(232, 0)">
      <rect width="215" height="135" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LEFT EYE (OS)</text>
      <text x="20" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">15.8</text>
      <text x="105" y="75" fill="#34d399" font-family="system-ui, sans-serif" font-size="16">mmHg</text>
      <text x="20" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">▼ -0.8 vs last week (Safe)</text>
    </g>

    <g transform="translate(464, 0)">
      <rect width="215" height="135" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">MEDICATION ADHERENCE</text>
      <text x="20" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">96.4%</text>
      <text x="20" y="105" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11">27 of 28 doses taken</text>
    </g>

    <g transform="translate(696, 0)">
      <rect width="384" height="135" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.2"/>
      <text x="24" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Cross-Platform Flutter Telehealth</text>
      <text x="24" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Designed with ophthalmologists to prevent vision loss through</text>
      <text x="24" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">daily compliance tracking, circadian alerts, and PDF export.</text>
      <rect x="24" y="90" width="100" height="28" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="36" y="108" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="10" font-weight="600">FLUTTER + DART</text>
      <rect x="134" y="90" width="110" height="28" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="146" y="108" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">LOCAL DATABASE</text>
    </g>
  </g>
</svg>
