<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a17"/>
      <stop offset="50%" stop-color="#150f24"/>
      <stop offset="100%" stop-color="#08050d"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1433"/>
      <stop offset="100%" stop-color="#120c21"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cvBg)"/>

  <!-- Top App Bar -->
  <rect x="50" y="30" width="1100" height="64" rx="8" fill="#1b122c" stroke="#8b5cf6" stroke-opacity="0.25"/>
  <rect x="75" y="47" width="30" height="30" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
  <circle cx="90" cy="62" r="7" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M90 52 L90 55 M90 69 L90 72 M80 62 L83 62 M97 62 L100 62" stroke="#a78bfa" stroke-width="2"/>
  <text x="120" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Digital Image Processing &amp; Segmentation</text>
  <text x="590" y="69" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">COMPUTER VISION WORKBENCH</text>

  <rect x="970" y="47" width="155" height="32" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <circle cx="988" cy="63" r="4" fill="#a78bfa"/>
  <text x="1002" y="68" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Otsu + Canny Active</text>

  <!-- 4 Step Image Processing Pipeline -->
  <g transform="translate(50, 115)">
    <!-- Stage 1: Original Image -->
    <rect width="260" height="360" rx="10" fill="url(#purpleCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="32" fill="#cbd5e1" font-family="system-ui" font-size="14" font-weight="600">1. Original Image (RGB)</text>
    
    <g transform="translate(20, 50)">
      <rect width="220" height="220" rx="6" fill="#130b21"/>
      <circle cx="110" cy="110" r="75" fill="#f59e0b" fill-opacity="0.8"/>
      <circle cx="85" cy="90" r="18" fill="#f43f5e" fill-opacity="0.8"/>
      <polygon points="120,70 170,140 80,140" fill="#06b6d4" fill-opacity="0.8"/>
    </g>
    <text x="20" y="300" fill="#94a3b8" font-family="system-ui" font-size="11">Input Source: 512x512 RGB</text>
    <text x="20" y="320" fill="#64748b" font-family="system-ui" font-size="10">Raw uncompressed bitmap data</text>
    <rect x="20" y="332" width="60" height="18" rx="3" fill="#ffffff" fill-opacity="0.08"/>
    <text x="28" y="345" fill="#e2e8f0" font-family="monospace" font-size="9">RGB_24</text>

    <!-- Stage 2: Grayscale & Filter -->
    <g transform="translate(280, 0)">
      <rect width="260" height="360" rx="10" fill="url(#purpleCard)" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="32" fill="#cbd5e1" font-family="system-ui" font-size="14" font-weight="600">2. Grayscale &amp; Blur</text>
      
      <g transform="translate(20, 50)">
        <rect width="220" height="220" rx="6" fill="#18181b"/>
        <circle cx="110" cy="110" r="75" fill="#71717a"/>
        <circle cx="85" cy="90" r="18" fill="#52525b"/>
        <polygon points="120,70 170,140 80,140" fill="#a1a1aa"/>
      </g>
      <text x="20" y="300" fill="#94a3b8" font-family="system-ui" font-size="11">Gaussian Filter (Kernel: 5x5)</text>
      <text x="20" y="320" fill="#64748b" font-family="system-ui" font-size="10">Noise suppression &amp; luminance</text>
      <rect x="20" y="332" width="70" height="18" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <text x="28" y="345" fill="#e2e8f0" font-family="monospace" font-size="9">GRAY_8BIT</text>
    </g>

    <!-- Stage 3: Canny Edges -->
    <g transform="translate(560, 0)">
      <rect width="260" height="360" rx="10" fill="url(#purpleCard)" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="32" fill="#cbd5e1" font-family="system-ui" font-size="14" font-weight="600">3. Canny Edge Detection</text>
      
      <g transform="translate(20, 50)">
        <rect width="220" height="220" rx="6" fill="#000000"/>
        <circle cx="110" cy="110" r="75" fill="none" stroke="#22c55e" stroke-width="2"/>
        <circle cx="85" cy="90" r="18" fill="none" stroke="#22c55e" stroke-width="2"/>
        <polygon points="120,70 170,140 80,140" fill="none" stroke="#22c55e" stroke-width="2"/>
      </g>
      <text x="20" y="300" fill="#94a3b8" font-family="system-ui" font-size="11">Threshold: Low 50 / High 150</text>
      <text x="20" y="320" fill="#64748b" font-family="system-ui" font-size="10">Gradient intensity contours</text>
      <rect x="20" y="332" width="85" height="18" rx="3" fill="#22c55e" fill-opacity="0.15"/>
      <text x="28" y="345" fill="#4ade80" font-family="monospace" font-size="9">EDGES_BINARY</text>
    </g>

    <!-- Stage 4: Segmentation Mask -->
    <g transform="translate(840, 0)">
      <rect width="260" height="360" rx="10" fill="url(#purpleCard)" stroke="#8b5cf6" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="600">4. Segmented Mask (Otsu)</text>
      
      <g transform="translate(20, 50)">
        <rect width="220" height="220" rx="6" fill="#090514"/>
        <circle cx="110" cy="110" r="75" fill="#8b5cf6" fill-opacity="0.4" stroke="#a78bfa" stroke-width="2"/>
        <circle cx="85" cy="90" r="18" fill="#ec4899" fill-opacity="0.5" stroke="#f472b6" stroke-width="2"/>
        <polygon points="120,70 170,140 80,140" fill="#06b6d4" fill-opacity="0.5" stroke="#22d3ee" stroke-width="2"/>
      </g>
      <text x="20" y="300" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="600">3 Isolated Regions Detected</text>
      <text x="20" y="320" fill="#64748b" font-family="system-ui" font-size="10">Connected components &amp; masks</text>
      <rect x="20" y="332" width="85" height="18" rx="3" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="28" y="345" fill="#c4b5fd" font-family="monospace" font-size="9">MASK_OUTPUT</text>
    </g>
  </g>

  <!-- Metrics & Parameter Panel -->
  <g transform="translate(50, 495)">
    <rect width="1100" height="130" rx="8" fill="url(#purpleCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="16" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">HISTOGRAM INTENSITY METRICS</text>
      <line x1="0" y1="30" x2="250" y2="30" stroke="#ffffff" stroke-opacity="0.08"/>
      <!-- Histogram bar chart mini -->
      <rect x="0" y="45" width="8" height="25" fill="#8b5cf6" fill-opacity="0.4"/>
      <rect x="12" y="35" width="8" height="35" fill="#8b5cf6" fill-opacity="0.6"/>
      <rect x="24" y="25" width="8" height="45" fill="#8b5cf6" fill-opacity="0.8"/>
      <rect x="36" y="20" width="8" height="50" fill="#8b5cf6"/>
      <rect x="48" y="30" width="8" height="40" fill="#8b5cf6" fill-opacity="0.7"/>
      <rect x="60" y="40" width="8" height="30" fill="#8b5cf6" fill-opacity="0.5"/>
      <rect x="72" y="50" width="8" height="20" fill="#8b5cf6" fill-opacity="0.4"/>
      <rect x="84" y="38" width="8" height="32" fill="#8b5cf6" fill-opacity="0.6"/>
      <rect x="96" y="22" width="8" height="48" fill="#8b5cf6" fill-opacity="0.9"/>
      <rect x="108" y="15" width="8" height="55" fill="#a78bfa"/>
      <rect x="120" y="28" width="8" height="42" fill="#8b5cf6" fill-opacity="0.7"/>
      <rect x="132" y="42" width="8" height="28" fill="#8b5cf6" fill-opacity="0.4"/>
      <text x="160" y="40" fill="#f8fafc" font-family="system-ui" font-size="18" font-weight="700">μ: 124.6</text>
      <text x="160" y="58" fill="#64748b" font-family="system-ui" font-size="11">StdDev σ: 42.1</text>
    </g>

    <g transform="translate(340, 20)">
      <text x="0" y="16" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">SEGMENTATION ACCURACY</text>
      <text x="0" y="50" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="700">94.8%</text>
      <text x="0" y="72" fill="#10b981" font-family="system-ui" font-size="11">IoU Score: 0.892 (Good overlap)</text>
    </g>

    <g transform="translate(600, 20)">
      <text x="0" y="16" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">MORPHOLOGICAL OPERATIONS</text>
      <text x="0" y="42" fill="#cbd5e1" font-family="system-ui" font-size="12">• Dilation (3x3 structuring element)</text>
      <text x="0" y="62" fill="#cbd5e1" font-family="system-ui" font-size="12">• Erosion &amp; Opening for noise cleaning</text>
      <text x="0" y="82" fill="#a78bfa" font-family="system-ui" font-size="11">Applied automatically post-thresholding</text>
    </g>

    <g transform="translate(900, 30)">
      <rect width="170" height="48" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="24" y="29" fill="#c4b5fd" font-family="system-ui" font-size="12" font-weight="600">OpenCV + NumPy</text>
    </g>
  </g>
</svg>
