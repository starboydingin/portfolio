      <text x="16" y="28" fill="#94a3b8" font-family="system-ui" font-size="11">TOTAL USERS</text>
      <text x="16" y="58" fill="#f8fafc" font-family="system-ui" font-size="24" font-weight="700">1,248</text>
      <text x="16" y="74" fill="#10b981" font-family="system-ui" font-size="10">▲ +12% this week</text>

      <rect x="170" y="0" width="155" height="85" rx="6" fill="#150a0d" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="16" y="28" fill="#94a3b8" font-family="system-ui" font-size="11" transform="translate(170,0)">ACTIVE SESSIONS</text>
      <text x="16" y="58" fill="#38bdf8" font-family="system-ui" font-size="24" font-weight="700" transform="translate(170,0)">384</text>
      <text x="16" y="74" fill="#64748b" font-family="system-ui" font-size="10" transform="translate(170,0)">Inertia SPA Mode</text>

      <rect x="340" y="0" width="155" height="85" rx="6" fill="#150a0d" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="16" y="28" fill="#94a3b8" font-family="system-ui" font-size="11" transform="translate(340,0)">AUTH GUARDS</text>
      <text x="16" y="58" fill="#f43f5e" font-family="system-ui" font-size="24" font-weight="700" transform="translate(340,0)">3 Roles</text>
      <text x="16" y="74" fill="#64748b" font-family="system-ui" font-size="10" transform="translate(340,0)">Admin, Editor, User</text>
    </g>

