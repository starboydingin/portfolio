      <text x="20" y="145" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Rizky Febrian</text>
      <text x="20" y="161" fill="#64748b" font-family="system-ui" font-size="10">rizky@example.com</text>
      <rect x="280" y="135" width="60" height="22" rx="4" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="296" y="150" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="700">EDITOR</text>
      <text x="420" y="150" fill="#10b981" font-family="system-ui" font-size="11">ACTIVE</text>

      <!-- Row 3 -->
      <line x1="20" y1="180" x2="477" y2="180" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="20" y="210" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Nurul Amanda</text>
      <text x="20" y="226" fill="#64748b" font-family="system-ui" font-size="10">nurul@example.com</text>
      <rect x="280" y="200" width="55" height="22" rx="4" fill="#a78bfa" fill-opacity="0.2"/>
      <text x="294" y="215" fill="#a78bfa" font-family="system-ui" font-size="10" font-weight="700">USER</text>
      <text x="420" y="215" fill="#10b981" font-family="system-ui" font-size="11">ACTIVE</text>

      <!-- Row 4 -->
      <line x1="20" y1="245" x2="477" y2="245" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="20" y="275" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Budi Pratama</text>
      <text x="20" y="291" fill="#64748b" font-family="system-ui" font-size="10">budi@example.com</text>
      <rect x="280" y="265" width="55" height="22" rx="4" fill="#a78bfa" fill-opacity="0.2"/>
      <text x="294" y="280" fill="#a78bfa" font-family="system-ui" font-size="10" font-weight="700">USER</text>
      <text x="420" y="280" fill="#64748b" font-family="system-ui" font-size="11">OFFLINE</text>
    </g>
  </g>
</svg>
