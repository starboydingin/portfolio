      <text x="20" y="80" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Adwika Farsha Ardhan</text>
      <text x="20" y="96" fill="#64748b" font-family="system-ui" font-size="10">adwikafa@gmail.com</text>
      <rect x="280" y="70" width="70" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
      <text x="296" y="85" fill="#f87171" font-family="system-ui" font-size="10" font-weight="700">SUPERADMIN</text>
      <text x="420" y="85" fill="#10b981" font-family="system-ui" font-size="11">ACTIVE</text>

      <!-- Row 2 -->
