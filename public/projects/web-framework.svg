<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140a0c"/>
      <stop offset="50%" stop-color="#1c0f13"/>
      <stop offset="100%" stop-color="#0a0507"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241418"/>
      <stop offset="100%" stop-color="#150a0d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#wfBg)"/>

  <!-- Top App Bar -->
  <rect x="50" y="30" width="1100" height="64" rx="8" fill="#1f1115" stroke="#ef4444" stroke-opacity="0.25"/>
  <rect x="75" y="47" width="30" height="30" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <path d="M82 55 L90 62 L98 55" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"/>
  <text x="120" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Web Framework Ganas</text>
  <text x="390" y="69" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">LARAVEL 12 + INERTIA + REACT</text>

  <rect x="970" y="47" width="155" height="32" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.3"/>
  <circle cx="988" cy="63" r="4" fill="#22c55e"/>
  <text x="1002" y="68" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Sanctum Auth Active</text>

  <!-- Left: Auth & Architecture -->
  <g transform="translate(50, 114)">
    <rect width="530" height="510" rx="10" fill="url(#redCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Full-Stack Flow &amp; Inertia Routing</text>
    
    <!-- Code Editor Box -->
    <rect x="24" y="60" width="482" height="260" rx="8" fill="#0c0608" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="44" cy="80" r="5" fill="#ef4444"/>
    <circle cx="60" cy="80" r="5" fill="#f59e0b"/>
    <circle cx="76" cy="80" r="5" fill="#10b981"/>
    <text x="110" y="84" fill="#64748b" font-family="monospace" font-size="11">routes/web.php &amp; UserController.php</text>

    <text x="44" y="120" fill="#f43f5e" font-family="monospace" font-size="12">Route::middleware(['auth:sanctum'])-&gt;group(function () {</text>
    <text x="64" y="145" fill="#cbd5e1" font-family="monospace" font-size="12">    Route::get('/dashboard', function () {</text>
    <text x="84" y="170" fill="#38bdf8" font-family="monospace" font-size="12">        return Inertia::render('Dashboard/Overview', [</text>
    <text x="104" y="195" fill="#a78bfa" font-family="monospace" font-size="12">            'users' =&gt; UserResource::collection(User::paginate()),</text>
    <text x="104" y="220" fill="#a78bfa" font-family="monospace" font-size="12">            'stats' =&gt; MetricsService::getRealtimeSummary(),</text>
    <text x="84" y="245" fill="#38bdf8" font-family="monospace" font-size="12">        ]);</text>
    <text x="64" y="270" fill="#cbd5e1" font-family="monospace" font-size="12">    });</text>
    <text x="44" y="295" fill="#f43f5e" font-family="monospace" font-size="12">});</text>

    <!-- Component Tree Breakdown -->
    <text x="24" y="355" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Reactivity Pipeline</text>
    <g transform="translate(24, 375)">
      <rect width="145" height="50" rx="6" fill="#1a0c10" stroke="#ef4444" stroke-opacity="0.3"/>
      <text x="14" y="24" fill="#f87171" font-family="system-ui" font-size="11" font-weight="700">LARAVEL CONTROLLER</text>
      <text x="14" y="40" fill="#94a3b8" font-family="system-ui" font-size="10">ORM Eloquent &amp; API</text>

      <rect x="165" y="0" width="150" height="50" rx="6" fill="#1a0c10" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="14" y="24" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" transform="translate(165, 0)">INERTIA ADAPTER</text>
      <text x="14" y="40" fill="#94a3b8" font-family="system-ui" font-size="10" transform="translate(165, 0)">Zero-API Client State</text>

      <rect x="335" y="0" width="147" height="50" rx="6" fill="#1a0c10" stroke="#61dafb" stroke-opacity="0.3"/>
      <text x="14" y="24" fill="#61dafb" font-family="system-ui" font-size="11" font-weight="700" transform="translate(335, 0)">REACT COMPONENT</text>
      <text x="14" y="40" fill="#94a3b8" font-family="system-ui" font-size="10" transform="translate(335, 0)">Tailwind UI Views</text>
    </g>

    <g transform="translate(24, 445)">
      <rect width="482" height="50" rx="6" fill="#10080a" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Integrasi CSRF Sanctum, auto validation errors handler, dan pagination modular.</text>
    </g>
  </g>

